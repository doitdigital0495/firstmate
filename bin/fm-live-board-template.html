<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Firstmate live board</title>
<link rel="icon" href="data:," />
<style>
/* Shipped renderer for bin/fm-live-board.sh. Self-contained: no external
   fonts, scripts, images or requests. Palette follows the Firstmate
   navy/gold/rust/sea tokens, adapted to an explicitly dark surface. */
:root {
  color-scheme: dark;
  --bg: #11172a; --bg-raised: #1a2238; --bg-card: #1f2843; --bg-inset: #161d33;
  --line: #2f3b5e; --line-soft: #263152;
  --text: #e9e3d3; --text-strong: #fbf4e2; --text-muted: #a7afc6; --text-faint: #7f89a6;
  --gold: #e0a52e; --gold-soft: #3a3020; --rust: #e08365; --rust-soft: #3b2421;
  --sea: #7cc4a0; --sea-soft: #1f3a30; --ocean: #8cc0dd; --ocean-soft: #1d3346;
  --focus: 0 0 0 3px #f0d38c;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { background: var(--bg); color: var(--text); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
a { color: var(--ocean); overflow-wrap: anywhere; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, .q-opt:focus-within { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.lb { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }
.lb-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.lb-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lb-title h1 { margin: 0; font-size: 1.35rem; color: var(--text-strong); letter-spacing: 0.01em; }
.lb-home { color: var(--text-muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.lb-fresh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-muted); font-size: 0.85rem; }
.lb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 16px 0; }
.lb-stat { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.lb-stat b { display: block; font-size: 1.3rem; color: var(--text-strong); }
.lb-stat span { color: var(--text-muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
.lb-stat.is-hot { border-color: #6b5326; background: var(--gold-soft); }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; border: 1px solid transparent; }
.b-live { background: var(--sea-soft); color: var(--sea); border-color: #2f6b4f; }
.b-warn { background: var(--gold-soft); color: var(--gold); border-color: #6b5326; }
.b-danger { background: var(--rust-soft); color: var(--rust); border-color: #6b3527; }
.b-info { background: var(--ocean-soft); color: var(--ocean); border-color: #2f5574; }
.b-muted { background: var(--bg-inset); color: var(--text-muted); border-color: var(--line); }
.dot { width: 8px; height: 8px; flex: none; }
.lb-banner { margin: 0 0 16px; border-radius: 10px; padding: 10px 14px; border: 1px solid #6b3527; background: var(--rust-soft); color: var(--text-strong); }
.lb-empty { text-align: center; padding: 40px 16px; margin: 0 0 14px; background: var(--bg-raised); border: 1px dashed var(--line); border-radius: 14px; color: var(--text-muted); }
.lb-empty h2 { color: var(--text-strong); margin: 8px 0 4px; font-size: 1.1rem; }
.proj { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 14px; margin: 0 0 14px; min-width: 0; }
.proj.has-q { border-color: #6b5326; }
.proj-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 6px; min-width: 0; }
.proj-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.proj-title h2 { margin: 0; font-size: 1.15rem; color: var(--text-strong); min-width: 0; overflow-wrap: anywhere; flex: 1 1 auto; }
.proj-desc { margin: 0; color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.proj-status { margin: 0; color: var(--text-strong); font-weight: 600; overflow-wrap: anywhere; }
.prog { display: grid; gap: 4px; }
.prog-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-inset); border: 1px solid var(--line-soft); }
.prog-bar span { display: block; height: 100%; }
.pb-done { background: var(--sea); } .pb-doing { background: var(--ocean); } .pb-next { background: var(--text-faint); } .pb-charted { background: var(--gold); }
.prog-text { color: var(--text-muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.prog-text .quiet { color: var(--text-faint); }
.proj-latest { margin: 0; font-size: 0.85rem; color: var(--text); overflow-wrap: anywhere; }
.proj-latest b { color: var(--text-muted); font-weight: 600; }
.proj-body { padding: 10px 12px 12px; display: grid; gap: 10px; min-width: 0; }
.sec-label { margin: 2px 4px 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); }
.q { background: var(--bg-card); border: 1px solid #6b5326; border-left: 4px solid var(--gold); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.q.q-urgent { border-color: #6b3527; border-left-color: var(--rust); }
.q.is-queued { border-color: #2f6b4f; border-left-color: var(--sea); padding: 8px 14px; }
.q.is-queued > *, .q.is-queued .q-form > * { display: none; }
.q.is-queued > .q-form, .q.is-queued .q-form > .q-answered { display: grid; margin-top: 0; }
.q-answered { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; min-width: 0; }
.q-answered-main { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.q-answered-main b { color: var(--sea); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
.q-answered-main span { color: var(--text-strong); }
.q-answered-acts { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.q-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.q h3 { margin: 0; font-size: 1.02rem; line-height: 1.4; color: var(--text-strong); overflow-wrap: anywhere; white-space: pre-wrap; }
.q-project { margin: 8px 0 0; color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.q-project b { color: var(--text-strong); font-weight: 600; }
.q-topic::before { content: "\00b7"; margin: 0 6px; }
.q-part { margin: 10px 0 0; min-width: 0; }
.q-label { margin: 0 0 2px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
.q-say { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.q-missing { display: grid; gap: 2px; margin: 10px 0 0; padding: 10px 12px; border-radius: 9px; border: 1px dashed var(--rust); background: var(--rust-soft); min-width: 0; overflow-wrap: anywhere; }
.q-missing b { color: var(--rust); }
.q-missing span { color: var(--text); font-size: 0.86rem; }
.q-why { margin: 8px 0 0; color: var(--text); font-size: 0.88rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.q-why b { color: var(--text-muted); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--text-muted); font-size: 0.8rem; }
.q-form { margin-top: 10px; display: grid; gap: 8px; min-width: 0; }
.q-opts { display: grid; gap: 8px; }
.q-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 4px 12px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-inset); cursor: pointer; min-width: 0; }
.q-opt:hover { border-color: #6b5326; }
.q-opt.is-rec { border-color: var(--sea); background: var(--sea-soft); }
.q-opt input { width: 20px; height: 20px; accent-color: var(--gold); margin: 1px 0 0; }
.q-opt-body { display: grid; gap: 2px; min-width: 0; }
.q-opt-label { color: var(--text-strong); font-weight: 600; overflow-wrap: anywhere; }
.q-opt-result { color: var(--text); font-size: 0.86rem; overflow-wrap: anywhere; }
.q-opt-lead { color: var(--text-muted); }
.q-note { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-inset); color: var(--text); font: inherit; }
textarea.q-note { min-height: 88px; resize: vertical; }
.q-note::placeholder { color: var(--text-faint); }
.q-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.btn { min-height: 44px; padding: 8px 18px; border-radius: 9px; border: 1px solid #6b5326; background: var(--gold); color: #1a2238; font: 600 0.95rem var(--font); cursor: pointer; }
.btn:hover { background: #f0d38c; }
.btn-quiet { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
.btn-quiet:hover { background: var(--bg-inset); }
.tray { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; border: 1px solid #2f6b4f; background: var(--sea-soft); color: var(--text-strong); min-width: 0; }
.tray-text { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.q-mode { color: var(--text-muted); font-size: 0.8rem; }
.q-status { font-size: 0.85rem; color: var(--sea); }
.q-status.err { color: var(--rust); }
.q-readonly { margin-top: 8px; padding: 8px 12px; border-radius: 9px; background: var(--bg-inset); border: 1px dashed var(--line); color: var(--text-muted); font-size: 0.85rem; }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: start; min-width: 0; }
.lane { display: grid; gap: 8px; align-content: start; min-width: 0; padding: 10px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-inset); }
.lane-head { display: grid; gap: 2px; min-width: 0; }
.lane-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0; font-size: 0.95rem; color: var(--text-strong); }
.lane-count { color: var(--text-muted); font-weight: 500; font-size: 0.82rem; }
.lane-say { margin: 0; color: var(--text-muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.lane-doing { border-top: 3px solid var(--sea); } .lane-next { border-top: 3px solid var(--ocean); } .lane-charted { border-top: 3px solid var(--gold); }
.lane-none { margin: 0; color: var(--text-faint); font-size: 0.85rem; }
.lane-more { min-width: 0; }
.lane-more summary { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; min-height: 28px; }
.lane-more-body { display: grid; gap: 8px; margin-top: 8px; min-width: 0; }
.lane-more:not([open]) > .lane-more-body { display: none; }
.w { display: grid; gap: 4px; padding: 9px 11px; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--bg-card); min-width: 0; }
.w .badge { justify-self: start; white-space: normal; }
.w-title { color: var(--text-strong); overflow-wrap: anywhere; }
.w-note { color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.w-when { color: var(--text-faint); font-size: 0.78rem; }
.tl { display: grid; gap: 8px; min-width: 0; padding: 10px; border: 1px solid var(--line-soft); border-top: 3px solid var(--text-faint); border-radius: 10px; background: var(--bg-inset); }
.tl-gap { margin: 0; color: var(--rust); font-size: 0.8rem; overflow-wrap: anywhere; }
.tl-track { display: flex; flex-wrap: wrap; gap: 6px 0; min-width: 0; }
.tl-item { position: relative; flex: 0 0 auto; }
.tl-item::before { content: ""; position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--line); }
.tl-item:first-child::before { left: 50%; }
.tl-item:last-child::before { right: 50%; }
.tl-pr { position: relative; display: grid; justify-items: center; align-content: start; gap: 2px; width: 66px; min-height: 76px; padding: 5px 2px 6px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--text-muted); font: inherit; cursor: pointer; }
.tl-pr:hover, .tl-pr.is-shown { background: var(--bg-card); border-color: var(--ocean); box-shadow: 0 0 0 1px var(--ocean); }
.tl-pr.is-pinned { background: var(--bg-card); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.tl-mark { display: block; width: 34px; height: 34px; border-radius: 50%; background: var(--bg-inset); }
.tl-mark svg { display: block; }
.tl-tag { font-size: 0.7rem; font-weight: 600; line-height: 1.2; }
.tl-date { font-size: 0.68rem; line-height: 1.2; color: var(--text-faint); }
.tl-pr.tl-succeeded .tl-tag { color: var(--sea); }
.tl-pr.tl-running .tl-tag { color: var(--gold); }
.tl-pr.tl-open .tl-tag { color: var(--ocean); }
.tl-pr.tl-failed { background: var(--rust-soft); border-color: #6b3527; }
.tl-pr.tl-failed .tl-tag { color: var(--rust); text-transform: uppercase; letter-spacing: 0.04em; }
.tl-pr.tl-failed:hover, .tl-pr.tl-failed.is-shown { background: var(--rust-soft); border-color: var(--ocean); }
.tl-pr.tl-failed.is-pinned { background: var(--rust-soft); border-color: var(--gold); }
.tl-detail { min-height: 44px; min-width: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 9px; background: var(--bg-card); color: var(--text-muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.tl-detail.is-on { border-style: solid; color: var(--text); }
.tl-detail.is-pinned { border-color: #6b5326; }
.tl-detail.tl-failed { border-color: #6b3527; border-left: 4px solid var(--rust); }
.tl-d-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tl-d-top .badge { white-space: normal; }
.tl-d-title { margin: 8px 0 0; font-size: 1rem; line-height: 1.35; color: var(--text-strong); }
.tl-d-sum { margin: 6px 0 0; color: var(--text); }
.tl-d-dep { margin: 8px 0 0; color: var(--text); }
.tl-d-dep b { color: var(--text-muted); font-weight: 600; }
.tl-d-runs { margin: 4px 0 0; padding-left: 18px; color: var(--text-muted); font-size: 0.84rem; }
.tl-d-runs .is-failed { color: var(--rust); font-weight: 600; }
.tl-d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; color: var(--text-muted); font-size: 0.82rem; }
.tl-d-foot .btn { min-height: 36px; padding: 4px 14px; font-size: 0.85rem; }
.idle .tl { margin: 6px 0 10px; }
.idle { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 14px; padding: 10px 16px; margin: 0 0 14px; }
.idle summary, .lb-notes summary { cursor: pointer; color: var(--text-muted); min-height: 28px; }
.idle ul, .lb-notes ul { margin: 8px 0 0; padding-left: 20px; color: var(--text-muted); }
.idle li, .lb-notes li { overflow-wrap: anywhere; margin: 3px 0; }
.idle li b { color: var(--text); font-weight: 600; }
.lb-notes { margin: 0 0 14px; border: 1px solid var(--line-soft); background: var(--bg-raised); border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; }
.lb-foot { margin-top: 20px; color: var(--text-faint); font-size: 0.78rem; overflow-wrap: anywhere; }
@media (max-width: 900px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .lb { padding: 14px 10px 40px; }
  .proj-head { padding: 12px; }
  .proj-body { padding: 8px; }
  .q { padding: 10px 12px; }
  .q-opt { grid-template-columns: auto minmax(0, 1fr); }
  .q-opt .rec { grid-column: 2; justify-self: start; }
  .lb-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .q-answered { grid-template-columns: minmax(0, 1fr); }
  .lb-stat span { font-size: 0.68rem; letter-spacing: 0.04em; }
}
</style>
</head>
<body>
<main class="lb" id="lb-root">
  <header class="lb-head">
    <div class="lb-title">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#1f2843" stroke="#e0a52e" stroke-width="2"/><path d="M14 5 L17 14 L14 23 L11 14 Z" fill="#e0a52e"/><circle cx="14" cy="14" r="2.2" fill="#11172a"/></svg>
      <div>
        <h1>Your projects</h1>
        <div class="lb-home" id="lb-home"></div>
      </div>
    </div>
    <div class="lb-fresh" id="lb-fresh" aria-live="polite"></div>
  </header>
  <div id="lb-banner"></div>
  <section class="lb-stats" id="lb-stats" aria-label="Totals"></section>
  <div id="lb-tray" aria-live="polite"></div>
  <div id="lb-projects"></div>
  <div id="lb-notes"></div>
  <p class="lb-foot" id="lb-foot"></p>
</main>
<script id="live-board-data" type="application/json">
__FM_LIVE_BOARD_DATA__
</script>
<script>
(function () {
  "use strict";
  var DOT = {
    live: '<svg class="dot" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#7cc4a0"/></svg>',
    warn: '<svg class="dot" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#e0a52e"/></svg>',
    danger: '<svg class="dot" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#e08365"/></svg>'
  };
  /* The projection decides each task's lane and reason; the page only words them. */
  var LANES = [
    ["doing", "Doing now", "A worker is on this right now.", "Nothing is being worked on right now."],
    ["next", "Next", "A worker starts these without you; nothing is in their way.", "Nothing is lined up to start on its own."],
    ["charted", "Charted next", "These will not start on their own. Each one says what it waits for.", "Nothing is waiting."]
  ];
  var LANE_SHOWN = 3;
  var WHY_CLASS = { stuck: "b-danger", "your-answer": "b-warn", deferred: "b-warn" };
  var READONLY = {
    stale: "This question changed after its answer options were written. Firstmate must refresh it before you can answer here.",
    duplicate: "This question carries conflicting answer options. Firstmate must review it before you can answer here.",
    invalid: "This question's answer options are malformed. Firstmate must review it before you can answer here.",
    ambiguous: "Firstmate cannot tell exactly which piece of work this question belongs to. It must review it before you can answer here."
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function badge(cls, text, dot) {
    var b = el("span", "badge " + cls);
    if (dot) { var d = el("span"); d.innerHTML = DOT[dot]; b.appendChild(d); }
    b.appendChild(el("span", "", text));
    return b;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
  function ago(seconds) {
    if (seconds < 0) seconds = 0;
    if (seconds < 90) return Math.round(seconds) + "s ago";
    if (seconds < 5400) return Math.round(seconds / 60) + " min ago";
    if (seconds < 172800) return Math.round(seconds / 3600) + " h ago";
    return Math.round(seconds / 86400) + " days ago";
  }
  function dateEpoch(text) {
    if (typeof text !== "string" || !text) return null;
    var iso = /^\d{4}-\d{2}-\d{2}$/.test(text) ? text + "T00:00:00Z" : text;
    var t = Date.parse(iso);
    return isNaN(t) ? null : t / 1000;
  }
  function utf8Bytes(s) {
    var n = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) n += 1; else if (c < 0x800) n += 2;
      else if (c >= 0xd800 && c <= 0xdbff) { n += 4; i++; } else n += 3;
    }
    return n;
  }
  function safePr(url) {
    return typeof url === "string" && /^https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/[^\s<>"?#]+\/pull\/[0-9]+$/.test(url) ? url : null;
  }

  var payload;
  try {
    payload = JSON.parse(document.getElementById("live-board-data").textContent);
  } catch (e) { payload = null; }
  var board = payload && payload.board;
  var view = payload && payload.view;
  if (!board || board.schema !== "fm-live-board.v1" || !view || view.schema !== "fm-live-board-view.v1"
      || !Array.isArray(view.projects)) {
    document.getElementById("lb-banner").appendChild(
      el("div", "lb-banner", "The board data could not be read. Run fm-live-board.sh build to rebuild it."));
    return;
  }
  var refresh = typeof payload.refresh_seconds === "number" && payload.refresh_seconds > 0 ? payload.refresh_seconds : 60;
  var staleAfter = Math.max(150, Math.round(refresh * 2.5));
  var unavailableAfter = Math.max(600, staleAfter * 2);

  document.getElementById("lb-home").textContent = "Firstmate live board · " + (board.home && board.home.label || "unknown home");

  /* Freshness is recomputed locally, so a board whose rebuilds stopped says so. */
  var fresh = document.getElementById("lb-fresh");
  var banner = document.getElementById("lb-banner");
  function paintFreshness() {
    var age = Date.now() / 1000 - board.collected_at_epoch;
    clear(fresh);
    clear(banner);
    var state;
    if (age > unavailableAfter) {
      state = badge("b-danger", "out of date", "danger");
      banner.appendChild(el("div", "lb-banner",
        "This board has not been rebuilt for " + ago(age).replace(" ago", "") +

  var TL_RING = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" ';

  function timelineSection(p) {

    var head = el("div", "proj-head");
    var title = el("div", "proj-title");
    title.appendChild(el("h2", "", p.name));
    if (c.urgent) title.appendChild(badge("b-danger", plural(c.urgent, "urgent question")));
    if (c.questions - (c.urgent || 0) > 0) title.appendChild(badge("b-warn", plural(c.questions - (c.urgent || 0), "question")));
    if (c.stuck) title.appendChild(badge("b-danger", c.stuck + " stuck"));
    if (c.failed_deploys) title.appendChild(badge("b-danger", plural(c.failed_deploys, "failed deploy")));
    head.appendChild(title);
    if (p.description) head.appendChild(el("p", "proj-desc", p.description));
    head.appendChild(el("p", "proj-status", p.status));
    head.appendChild(progress(c));
    if (p.latest) {
      var latest = el("p", "proj-latest");
      latest.setAttribute("data-latest", "");
      latest.appendChild(el("b", "", "Latest: "));
      latest.appendChild(el("span", "", p.latest.title + " - " + p.latest.note +
        (typeof p.latest.at === "number" ? " (" + ago(Date.now() / 1000 - p.latest.at) + ")" : "")));
      head.appendChild(latest);
    }
    sec.appendChild(head);
    var body = el("div", "proj-body");
    if ((p.questions || []).length) {
      body.appendChild(el("div", "sec-label", "Questions for you"));
      p.questions.forEach(function (q) { body.appendChild(questionCard(q, p.name)); });
    }
    var lanes = el("div", "lanes");
    LANES.forEach(function (lane) { lanes.appendChild(laneSection(lane, (p.lanes || {})[lane[0]] || [])); });
    body.appendChild(lanes);
    body.appendChild(timelineSection(p));
    sec.appendChild(body);
    return sec;
  }

  var host = document.getElementById("lb-projects");
  var active = view.projects.filter(function (p) { return p.active; });
  var quiet = view.projects.filter(function (p) { return !p.active; });
  if (!active.length) {
    var empty = el("div", "lb-empty");
    empty.setAttribute("data-empty", "true");
    empty.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#1f3a30"/><path d="M12 20 L18 26 L29 14" fill="none" stroke="#7cc4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    empty.appendChild(el("h2", "", "Nothing running and no questions for you"));
    empty.appendChild(el("p", "", (board.coverage && board.coverage.local && board.coverage.local.trustworthy)
      ? "No project has open work right now."
      : "No open work was found, but the board could not see everything - see the board notes below."));
    host.appendChild(empty);
  }
  active.forEach(function (p) { host.appendChild(projectSection(p)); });
  if (quiet.length) {
    var box = el("details", "idle");
    box.setAttribute("data-idle", String(quiet.length));
    box.appendChild(el("summary", "", plural(quiet.length, "quiet project") + " with no open work"));
    var ul = el("ul");
    quiet.forEach(function (p) {
      var li = el("li");
      li.setAttribute("data-quiet-project", p.name);
      li.appendChild(el("b", "", p.name));
      var extra = [];
      if (p.counts && p.counts.finished) extra.push(p.counts.finished + " done in the last 2 weeks");
      if (p.counts && p.counts.failed_deploys) extra.push(plural(p.counts.failed_deploys, "failed deploy"));
      if (extra.length) li.appendChild(el("span", "", " - " + extra.join(" · ")));
      if (p.timeline && ((p.timeline.items || []).length || (p.timeline.unread || []).length)) li.appendChild(timelineSection(p));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    host.appendChild(box);
  }

  function syncRestored() {
    syncAnswers();
    pinSyncs.forEach(function (sync) { sync(); });
  }
  syncAnswers();
  paintTray();
  /* Lavish restores form fields by message after a reload, so repaint then. */
  if (typeof window.addEventListener === "function") {
    window.addEventListener("message", function () {
      setTimeout(syncRestored, 0);
      setTimeout(syncRestored, 300);
    });
  }

  if ((view.notes || []).length) {
    var notes = el("details", "lb-notes");
    notes.appendChild(el("summary", "", plural(view.notes.length, "board note")));
    var nl = el("ul");
    view.notes.forEach(function (t) { nl.appendChild(el("li", "", t)); });
    notes.appendChild(nl);
    document.getElementById("lb-notes").appendChild(notes);
  }

  document.getElementById("lb-foot").textContent =
    "Collected " + board.collected_at + " in " + board.collection_duration_seconds + "s · revision " +
    String(board.revision || "").slice(0, 12) + " · answers go through Firstmate's captain-hold intake.";
})();
</script>
</body>
</html>
