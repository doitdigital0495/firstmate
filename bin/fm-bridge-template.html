<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<title>Firstmate Bridge</title>
<link rel="icon" href="data:," />
<style>
/* Shipped renderer for bin/fm-bridge.sh. Self-contained: no external fonts,
   scripts, images or requests. Palette follows the live board's navy, gold,
   rust and sea tokens on an explicitly dark surface. */
:root {
  color-scheme: dark;
  --bg: #10162a; --bg-raised: #171f36; --bg-card: #1d2640; --bg-inset: #141b30;
  --line: #2c3858; --line-soft: #222c4a;
  --text: #e9e3d3; --text-strong: #fbf4e2; --text-muted: #a7afc6; --text-faint: #8590ad;
  --gold: #e0a52e; --gold-soft: #3a3020; --rust: #e08365; --rust-soft: #3b2421;
  --sea: #7cc4a0; --sea-soft: #1f3a30; --ocean: #8cc0dd; --ocean-soft: #1d3346;
  --focus: 0 0 0 3px #f0d38c;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html { background: #10162a; background: var(--bg); color: var(--text); }
body { margin: 0; background: #10162a; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.br { max-width: 860px; margin: 0 auto; padding: 16px 14px 48px; }
.br-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.br-head h1 { margin: 0; font-size: 1.3rem; color: var(--text-strong); }
.fresh { color: var(--text-muted); font-size: 0.85rem; }
.fresh.is-stale { color: var(--rust); font-weight: 600; }
.banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-raised); font-size: 0.92rem; }
.banner.bad { border-color: var(--rust); background: var(--rust-soft); color: var(--text-strong); }
.banner.warn { border-color: var(--gold); background: var(--gold-soft); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
.stat { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 1.5rem; color: var(--text-strong); line-height: 1.1; }
.stat span { color: var(--text-muted); font-size: 0.82rem; }
.stat.you b { color: var(--gold); }
h2 { margin: 22px 0 8px; font-size: 1.05rem; color: var(--text-strong); }
h2 small { color: var(--text-muted); font-weight: 400; }
.empty { color: var(--text-muted); font-size: 0.92rem; margin: 4px 0; }
.card { background: var(--bg-card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; overflow-wrap: anywhere; }
.card.old { border-left-color: var(--rust); }
.card.is-queued { border-left-color: var(--sea); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 0.8rem; color: var(--text-muted); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--bg-inset); border: 1px solid var(--line-soft); }
.chip.age { color: var(--gold); border-color: var(--gold-soft); }
.chip.age.old { color: var(--rust); border-color: var(--rust); }
.chip.flag { color: var(--rust); }
.chip.ok { color: var(--sea); }
.q { margin: 6px 0 4px; color: var(--text-strong); font-size: 0.98rem; }
.ctx { margin: 2px 0; color: var(--text); font-size: 0.9rem; }
.ctx b, .blocks b { color: var(--text-muted); font-weight: 600; }
.blocks { margin: 4px 0; font-size: 0.85rem; color: var(--text-muted); }
form { margin: 8px 0 0; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; margin: 4px 0; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--bg-inset); cursor: pointer; }
.opt.rec { border-color: var(--gold); }
.opt input { margin-top: 3px; accent-color: var(--gold); }
.opt small { display: block; color: var(--text-muted); }
.opt em { color: var(--gold); font-style: normal; font-size: 0.78rem; }
textarea, input[type=text] { width: 100%; margin: 6px 0 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-inset); }
textarea { min-height: 64px; resize: vertical; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; }
.btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold-soft); color: var(--text-strong); cursor: pointer; }
.btn.quiet { border-color: var(--line); background: transparent; color: var(--text-muted); }
.hint { color: var(--text-muted); font-size: 0.8rem; }
.err { color: var(--rust); font-size: 0.85rem; }
.done { color: var(--sea); font-size: 0.9rem; }
details.group { margin: 6px 0 10px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-raised); }
details.group > summary { padding: 8px 12px; cursor: pointer; color: var(--text); }
details.group > div { padding: 2px 10px 4px; }
.clock { margin: 6px 0 2px; padding: 6px 8px; border-radius: 8px; background: var(--bg-inset); border: 1px dashed var(--gold); font-size: 0.86rem; }
.clock.held { border-color: var(--line); color: var(--text-muted); }
.parked { margin: 4px 0; padding-left: 18px; font-size: 0.88rem; }
.parked li { margin: 3px 0; }
.sources { margin-top: 26px; font-size: 0.82rem; color: var(--text-faint); }
.sources li { margin: 2px 0; }
.sources .bad { color: var(--rust); }
.fleet { margin-top: 26px; }
.fleet h3 { margin: 16px 0 6px; font-size: 0.95rem; color: var(--text-strong); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 6px 0; font-size: 0.8rem; color: var(--text-muted); }
.chip.warn { color: var(--gold); border-color: var(--gold-soft); }
.fhome.d1 { margin-left: 10px; } .fhome.d2 { margin-left: 20px; } .fhome.d3 { margin-left: 30px; }
.fhome > summary b { color: var(--text-strong); }
.frow { border-top: 1px solid var(--line-soft); padding: 7px 2px; overflow-wrap: anywhere; }
.frow:first-child { border-top: 0; }
.frow .t { color: var(--text-strong); font-weight: 600; }
.frow p { margin: 3px 0 0; font-size: 0.86rem; }
.frow a { color: var(--ocean); }
.st-working { color: var(--sea); } .st-blocked, .st-failed, .st-unknown { color: var(--rust); } .st-parked { color: var(--gold); }
.usage li { margin: 3px 0; font-size: 0.88rem; }
.usage { padding-left: 18px; margin: 4px 0; }
/* Tasks (slice 3): rows open to an explainer; Select several removes many at once. */
.tk-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
.tk-tools input[type=search] { flex: 1 1 160px; min-width: 0; margin: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-inset); }
.pill { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-inset); color: var(--text-muted); font-size: 0.82rem; cursor: pointer; }
.pill.on { border-color: var(--gold); color: var(--text-strong); background: var(--gold-soft); }
.tk { border-bottom: 1px solid var(--line-soft); padding: 6px 2px; overflow-wrap: anywhere; }
.tk:last-child { border-bottom: 0; }
.tk-head { display: flex; gap: 8px; align-items: flex-start; }
.tk-head input[type=checkbox] { margin-top: 4px; accent-color: var(--gold); width: 18px; height: 18px; flex: none; }
.tk-open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--text); }
.tk-open b { color: var(--text-strong); font-weight: 600; }
.tk-open .meta { margin-top: 2px; }
.tk-body { margin: 6px 0 2px 26px; font-size: 0.88rem; }
.tk-body p { margin: 3px 0; }
.tk-body b { color: var(--text-muted); font-weight: 600; }
.tk.is-pending { opacity: 0.6; }
.tk-sel { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 8px 0; padding: 8px 10px; border: 1px solid var(--gold); border-radius: 10px; background: var(--bg-raised); }
.tk-sel b { color: var(--text-strong); margin-right: auto; }
.confirm { margin: 8px 0; padding: 10px 12px; border: 1px solid var(--gold); border-radius: 10px; background: var(--bg-card); }
.confirm h3 { margin: 0 0 6px; font-size: 1rem; color: var(--text-strong); }
.confirm ul { margin: 4px 0 8px; padding-left: 18px; font-size: 0.88rem; }
.btn.danger { border-color: var(--rust); background: var(--rust-soft); }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main class="br" id="bridge">
  <div class="br-head"><h1>Bridge</h1><span class="fresh" id="fresh" role="status">Loading</span></div>
  <div id="root"><p class="empty">This page needs JavaScript to show the questions.</p></div>
</main>
<script id="bridge-data" type="application/json">
__FM_BRIDGE_DATA__
</script>
<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("bridge-data").textContent); } catch (e) { data = null; }
  var root = document.getElementById("root");
  var fresh = document.getElementById("fresh");
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function utf8Bytes(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 3; } }
  function nowSec() { return Math.floor(Date.now() / 1000); }
  function ago(sec) {
    if (sec < 90) return Math.max(0, sec) + " s";
    if (sec < 5400) return Math.round(sec / 60) + " min";
    if (sec < 172800) return Math.round(sec / 3600) + " h";
    return Math.round(sec / 86400) + " days";
  }
  if (!data || data.schema !== "fm-bridge-asks.v1" || !Array.isArray(data.asks)) {
    clear(root);
    root.appendChild(el("div", "banner bad", "The Bridge data could not be read. Nothing below is current; ask Firstmate to rebuild the Bridge."));
    fresh.textContent = "Unreadable"; fresh.className = "fresh is-stale";
    return;
  }

  var refresh = Number(data.refresh_seconds) || 60;
  var staleAfter = Math.max(150, Math.round(refresh * 2.5));
  var checked = Number(data.checked_epoch || data.generated_epoch) || 0;
  var staleBanner = el("div", "banner bad");
  staleBanner.hidden = true;
  function tickFresh() {
    var age = nowSec() - checked;
    var stale = age > staleAfter;
    fresh.textContent = stale ? "Out of date: last checked " + ago(age) + " ago" : "Checked " + ago(age) + " ago";
    fresh.className = "fresh" + (stale ? " is-stale" : "");
    staleBanner.hidden = !stale;
    staleBanner.textContent = "This board was last checked " + ago(age) + " ago, longer than it should be. "
      + "The Bridge builder or Firstmate's watcher may have stopped, so questions asked since then are missing.";
  }

  var asks = data.asks;
  var counts = data.counts || {};
  var complete = data.complete === true;
  clear(root);
  root.appendChild(staleBanner);

  /* Unread sources: never a green zero. */
  var srcItems = (data.sources && data.sources.items) || [];
  var unread = srcItems.filter(function (s) { return s.read !== "ok"; });
  if (!complete) {
    var b = el("div", "banner bad");
    b.appendChild(el("b", "", "Not everything could be read, so there may be more questions than shown."));
    var ul = el("ul");
    unread.forEach(function (s) { ul.appendChild(el("li", "", s.label + ": " + (s.detail || s.read))); });
    b.appendChild(ul);
    root.appendChild(b);
  }
  if (data.watcher && data.watcher.fresh === false) {
    root.appendChild(el("div", "banner warn", "Firstmate's watcher has not checked in recently (last " + (data.watcher.beacon || "never") + "), so this board may stop updating."));
  }

  var stats = el("div", "stats");
  function stat(cls, n, label) {
    var s = el("div", "stat " + cls);
    s.appendChild(el("b", "", (complete ? "" : "at least ") + n));
    s.appendChild(el("span", "", label));
    stats.appendChild(s);
  }
  stat("you", counts.you || 0, "need you");
  stat("", counts.firstmate || 0, "wait on Firstmate");
  stat("", counts.secondmates || 0, "wait on a secondmate");
  stat("", (counts.relayed || 0) + (counts.moot || 0), "relayed or probably settled");
  root.appendChild(stats);

  /* Desktop alerts: say plainly whether this page is the only signal. */
  (function () {
    var a = data.alerts;
    if (!a) return;
    var b;
    function stepWords(list) {
      var words = (list || []).map(function (sec) { return sec === 0 ? "arrival" : ago(sec); });
      return words.length > 1 ? words.slice(0, -1).join(", ") + " and " + words[words.length - 1] : (words[0] || "arrival");
    }
    if (!a.configured) {
      b = el("div", "banner", "Desktop alerts are not set up, so this page is the only place new questions show. Firstmate can switch them on.");
    } else if (a.problem) {
      b = el("div", "banner bad", "Desktop alerts are off because their settings could not be read (" + a.problem + "). Only this page shows new questions.");
    } else if (!(a.channels || []).length || (a.channels || []).indexOf("off") >= 0) {
      b = el("div", "banner", "Desktop alerts are switched off, so this page is the only place new questions show.");
    } else {
      var text = "Desktop alerts are on (" + a.channels.join(", ") + "): one when a question for you arrives and again at " + stepWords((a.steps || []).filter(function (x) { return x > 0; })) + ".";
      var bad = false;
      if (a.last && a.last.epoch) {
        text += " Last alert " + ago(nowSec() - a.last.epoch) + " ago: " + a.last.text;
        if ((a.last.failed || []).length) { text += " It could not be delivered through " + a.last.failed.join(", ") + "."; bad = true; }
        else if (!a.last.tried) { text += " No desktop channel works on this computer, so it was shown here only."; bad = true; }
      }
      b = el("div", "banner" + (bad ? " warn" : ""), text);
    }
    b.setAttribute("data-alerts", "1");
    root.appendChild(b);
  })();

  if (counts.unregistered > 0) {
    root.appendChild(el("div", "banner warn", counts.unregistered === 1
      ? "1 question from the crew has no question card for you yet. It waits on Firstmate, who answers it or turns it into a card; you may answer it here too."
      : counts.unregistered + " questions from the crew have no question card for you yet. They wait on Firstmate, who answers them or turns them into cards; you may answer them here too."));
  }

  /* Queued answers survive a live reload through one hidden field per card,
     keyed to the card's ask id, which changes whenever the question does. */
  function card(q) {
    var age = q.asked_epoch ? nowSec() - q.asked_epoch : null;
    var old = age !== null && age >= 4 * 3600;
    var c = el("article", "card" + (old ? " old" : ""));
    c.setAttribute("data-ask", q.ask || "");
    var meta = el("div", "meta");
    meta.appendChild(el("span", "", (q.home ? q.home + " - " : "") + (q.asker || "Unknown asker")));
    if (age !== null) {
      meta.appendChild(el("span", "chip age" + (old ? " old" : ""), (q.asked_estimated ? "about " : "") + ago(age) + " old"));
    } else {
      meta.appendChild(el("span", "chip age", "age unknown"));
    }
    if (age !== null && age >= 86400) meta.appendChild(el("span", "chip flag", "over a day"));
    meta.appendChild(el("span", "chip", q.source === "hold" ? "question for you" : "crew question"));
    if (q.as_of_epoch) meta.appendChild(el("span", "chip", "as of " + ago(nowSec() - q.as_of_epoch) + " ago"));
    (q.flags || []).forEach(function (f) {
      var words = { "worker-gone": "worker no longer running", "likely-moot": "probably settled", "relayed": "also relayed to Firstmate" }[f] || f;
      meta.appendChild(el("span", "chip flag", words));
    });
    if (q.deferred_until) meta.appendChild(el("span", "chip", "put off until " + q.deferred_until));
    c.appendChild(meta);
    if (q.about) { var a = el("p", "ctx"); a.appendChild(el("b", "", "What this is: ")); a.appendChild(document.createTextNode(q.about)); c.appendChild(a); }
    if (q.purpose) { var p = el("p", "ctx"); p.appendChild(el("b", "", "Why it matters: ")); p.appendChild(document.createTextNode(q.purpose)); c.appendChild(p); }
    c.appendChild(el("p", "q", q.question || "(no question text recorded)"));
    var waits = (q.blocks || []).slice(0, 5);
    if (waits.length || q.blocks_text) {
      var bl = el("p", "blocks");
      bl.appendChild(el("b", "", "Waiting on this: "));
      bl.appendChild(document.createTextNode(waits.length ? waits.join("; ") + ((q.blocks || []).length > 5 ? "; and " + ((q.blocks.length) - 5) + " more" : "") : q.blocks_text));
      c.appendChild(bl);
    }
    if (q.default) c.appendChild(clock(q, c));
    if (q.who !== "you" && !q.group && age !== null && age >= 900) {
      var waitOn = q.who === "firstmate" ? "Firstmate" : (q.home || "a secondmate");
      meta.appendChild(el("span", "chip flag", "Waiting on " + waitOn + " " + ago(age)));
      c.appendChild(actionButton(q, c, "nudge", "Nudge Firstmate",
        "Nudge queued: Firstmate is asked to settle this now.",
        "Bridge nudge " + q.ask + " (route with fm-bridge.sh route " + q.ask + "): the captain asks Firstmate to settle this question now - " + q.question));
    }
    if (q.away_note) c.appendChild(el("p", "hint", q.away_note));
    if (q.answer_note) c.appendChild(el("p", "err", q.answer_note));
    if (q.answer !== "none") c.appendChild(answerForm(q, c));
    return c;
  }

  /* A deadline default as the captain reads it: a countdown with a way to stop
     it, or why this question can never go ahead without an answer. */
  function clock(q, c) {
    var d = q.default, box;
    if (d.state === "pending" && d.due_epoch) {
      var left = d.due_epoch - nowSec();
      box = el("div", "clock");
      box.appendChild(el("p", "hint", left > 0
        ? "Goes ahead with the recommended answer (" + (d.label || "recommended") + ") in " + ago(left) + ", marked as not your words, unless you answer first."
        : "Due now: Firstmate goes ahead with the recommended answer (" + (d.label || "recommended") + ") at its next check, marked as not your words, unless you answer first."));
      box.appendChild(actionButton(q, c, "stop-clock", "Stop the clock",
        "Stop queued: Firstmate stops the clock, and this waits for your answer.",
        "Bridge stop the clock " + q.ask + " (route with fm-bridge.sh route " + q.ask + "): the captain wants no default for this question - " + q.question));
      return box;
    }
    box = el("div", "clock held");
    if (d.state === "stopped") box.textContent = "You stopped the clock: this waits for your answer.";
    else if (d.state === "blocked") box.textContent = "Cannot go ahead without you: the recommended answer would " + (d.reason ? "touch " + d.reason : "need your approval") + ".";
    else if (d.state === "never") box.textContent = "Cannot go ahead without you: this is " + (d.reason || "a call only you can make") + ".";
    else box.textContent = "Waits for your answer.";
    return box;
  }

  /* One queued request (nudge, stop the clock) for Firstmate, kept across a
     live reload like an answer, keyed to the card's ask id. */
  function actionButton(q, c, action, label, doneWords, prompt) {
    var wrap = el("div", "foot");
    var btn = el("button", "btn quiet", label);
    btn.type = "button";
    btn.setAttribute("data-action", action);
    var status = el("span", "hint");
    status.setAttribute("role", "status");
    var kept = document.createElement("input");
    kept.type = "hidden"; kept.name = action; kept.value = "";
    wrap.appendChild(btn); wrap.appendChild(status); wrap.appendChild(kept);
    var stamp = String(q.ask || "");
    function sync() {
      var on = String(kept.value || "") === stamp && stamp !== "";
      btn.hidden = on;
      status.className = on ? "done" : "hint";
      if (on) status.textContent = doneWords;
    }
    syncers.push(sync);
    btn.addEventListener("click", function () {
      if (!(window.lavish && window.lavish.queuePrompt)) { status.className = "err"; status.textContent = "This only works when the board is open in Lavish."; return; }
      var schema = action === "nudge" ? "fm-bridge-nudge.v1" : "fm-bridge-stop-clock.v1";
      window.lavish.queuePrompt(prompt, { tag: "choice", text: label + ": " + q.question, element: wrap, data: { schema: schema, ask: q.ask } });
      kept.value = stamp;
      announce(kept);
      sync();
    });
    return wrap;
  }

  function answerForm(q, c) {
    var form = el("form");
    var options = Array.isArray(q.options) ? q.options : [];
    var radios = [];
    options.forEach(function (o) {
      var lab = el("label", "opt" + (q.recommendation === o.value ? " rec" : ""));
      var r = document.createElement("input");
      r.type = "radio"; r.name = "pick"; r.value = o.value;
      radios.push(r);
      lab.appendChild(r);
      var txt = el("span");
      txt.appendChild(el("span", "", o.label));
      if (q.recommendation === o.value) { txt.appendChild(document.createTextNode(" ")); txt.appendChild(el("em", "", "recommended")); }
      if (o.detail) txt.appendChild(el("small", "", o.detail));
      lab.appendChild(txt);
      form.appendChild(lab);
    });
    var note;
    if (options.length) {
      note = document.createElement("input"); note.type = "text";
      note.placeholder = "optional note"; note.setAttribute("aria-label", "Optional note");
    } else {
      note = document.createElement("textarea");
      note.placeholder = "Type your answer"; note.setAttribute("aria-label", "Your answer");
    }
    note.name = "note";
    form.appendChild(note);
    var foot = el("div", "foot");
    var btn = el("button", "btn", q.approve ? "Queue approval" : "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);
    var status = el("span", "hint");
    status.setAttribute("role", "status");
    foot.appendChild(status);
    form.appendChild(foot);
    var kept = document.createElement("input");
    kept.type = "hidden"; kept.name = "queued"; kept.value = "";
    form.appendChild(kept);
    var doneBox = el("div", "done"); doneBox.hidden = true;
    var doneText = el("span");

      var go = {}, kept = [];
      ids.forEach(function (id) { if (byId[id] && !byId[id].keep && !state.pending[id]) go[id] = true; else if (byId[id]) kept.push([id, byId[id].keep_text || "It is already queued."]); });
      var changed = true;
      while (changed) {
        changed = false;
        Object.keys(go).forEach(function (id) {
          var stays = (byId[id].needed_by || []).filter(function (d) { return !go[d.id]; });
          if (stays.length) {
            delete go[id]; changed = true;
            kept.push([id, (tasks.needed_text || "Another open task still needs it; select that task too.") + " (needed by: " + stays.map(function (d) { return d.title; }).join("; ") + ")"]);
          }
        });
      }
      return { go: ids.filter(function (id) { return go[id]; }), kept: kept };
    }
    function ask(ids) {
      var p = plan(ids);
      clear(confirmBox);
      confirmBox.hidden = false;
      confirmBox.appendChild(el("h3", "", p.go.length ? "Remove " + noun(p.go.length, "task", "tasks") + " from Firstmate's memory?" : "Nothing here can be removed"));
      if (p.go.length) {
        confirmBox.appendChild(el("p", "hint", "Removed now (" + p.go.length + "):"));
        var ul = el("ul");
        p.go.forEach(function (id) { ul.appendChild(el("li", "", byId[id].title + (byId[id].kind === "suggestion" ? " (suggestion)" : ""))); });
        confirmBox.appendChild(ul);
      }
      if (p.kept.length) {
        confirmBox.appendChild(el("p", "hint", "Kept (" + p.kept.length + "):"));
        var ul2 = el("ul");
        p.kept.forEach(function (k) { ul2.appendChild(el("li", "", byId[k[0]].title + " - " + k[1])); });
        confirmBox.appendChild(ul2);
      }
      if (p.go.length) confirmBox.appendChild(el("p", "hint", "They leave every list. Each one stays restorable for " + (tasks.keep_days || 90) + " days under Removed, one by one or all together."));
      var foot = el("div", "foot");
      var status = el("span", "err"); status.setAttribute("role", "status");
      if (p.go.length) {
        var yes = el("button", "btn danger", "Remove " + noun(p.go.length, "task", "tasks"));
        yes.type = "button"; yes.setAttribute("data-act", "confirm-remove");
        yes.addEventListener("click", function () {
          if (p.go.length > 200) { status.textContent = "At most 200 tasks per press; select fewer."; return; }
          if (!(window.lavish && window.lavish.queuePrompt)) { status.textContent = "Remove only works when this board is open in Lavish."; return; }
          var batch = "b" + nowSec().toString(36) + "-" + Math.floor(Math.random() * 1679616).toString(36);
          var items = p.go.map(function (id) { return byId[id].rev ? { id: id, rev: byId[id].rev } : { id: id }; });
          var titles = p.go.map(function (id) { return byId[id].title; });
          window.lavish.queuePrompt("Bridge remove of " + noun(p.go.length, "task", "tasks") + " (batch " + batch + "): " + titles.join("; ").slice(0, 600)
            + ". Apply with bin/fm-bridge-intake.sh <this result file>.",
            { tag: "choice", text: "Remove " + noun(p.go.length, "task", "tasks"), element: confirmBox,
              data: { schema: "fm-bridge-action.v1", action: "remove", batch: batch, items: items } });
          p.go.forEach(function (id) { state.pending[id] = true; state.selected[id] = false; });
          confirmBox.hidden = true;
          notice.hidden = false;
          notice.textContent = "Removal of " + noun(p.go.length, "task", "tasks") + " is queued in Lavish (batch " + batch + "). Firstmate applies it and checks every task again; the result shows under Last results.";
          draw();
        });
        foot.appendChild(yes);
      }
      var no = el("button", "btn quiet", p.go.length ? "Cancel" : "Close");
      no.type = "button"; no.setAttribute("data-act", "cancel-remove");
      no.addEventListener("click", function () { confirmBox.hidden = true; });
      foot.appendChild(no);
      foot.appendChild(status);
      confirmBox.appendChild(foot);
    }
    draw();

    /* Removed: restorable for the keep window, by batch or one by one. */
    var removed = Array.isArray(tasks.removed) ? tasks.removed : [];
    if (removed.length) {
      var rd = el("details", "group");
      rd.appendChild(el("summary", "", "Removed, restorable for " + (tasks.keep_days || 90) + " days (" + removed.length + ")"));
      var rin = el("div");
      var batches = [], byBatch = {};
      removed.forEach(function (r) { if (!byBatch[r.batch]) { byBatch[r.batch] = []; batches.push(r.batch); } byBatch[r.batch].push(r); });
      function queueRestore(batch, items, label, where) {
        if (!(window.lavish && window.lavish.queuePrompt)) { where.textContent = "Restore only works when this board is open in Lavish."; return false; }
        window.lavish.queuePrompt("Bridge restore of " + label + " (batch " + batch + "). Apply with bin/fm-bridge-intake.sh <this result file>.",
          { tag: "choice", text: "Restore " + label, element: rin,
            data: { schema: "fm-bridge-action.v1", action: "restore", batch: batch, items: items } });
        where.textContent = "Restore of " + label + " is queued in Lavish.";
        return true;
      }
      batches.forEach(function (bid) {
        var list2 = byBatch[bid];
        var when = new Date(list2[0].removed_epoch * 1000).toISOString().slice(0, 10);
        var head = el("div", "foot");
        head.appendChild(el("b", "", "Removed " + when + " (" + list2.length + ")"));
        var st = el("span", "hint"); st.setAttribute("role", "status");
        if (list2.length > 1) {
          var allBtn = el("button", "btn quiet", "Restore all " + list2.length);
          allBtn.type = "button"; allBtn.setAttribute("data-act", "restore-batch"); allBtn.setAttribute("data-id", bid);
          allBtn.addEventListener("click", function () { if (queueRestore(bid, [], noun(list2.length, "task", "tasks"), st)) allBtn.disabled = true; });
          head.appendChild(allBtn);
        }
        head.appendChild(st);
        rin.appendChild(head);
        var ul = el("ul");
        list2.forEach(function (r) {
          var li = el("li", "", r.title + " ");
          var one = el("button", "btn quiet", "Restore");
          one.type = "button"; one.setAttribute("data-act", "restore-one"); one.setAttribute("data-id", r.id);
          var st1 = el("span", "hint");
          one.addEventListener("click", function () { if (queueRestore(bid, [{ id: r.id }], "\"" + r.title + "\"", st1)) one.disabled = true; });
          li.appendChild(one); li.appendChild(st1);
          ul.appendChild(li);
        });
        rin.appendChild(ul);
      });
      rd.appendChild(rin);
      box.appendChild(rd);
    }
    var receipts = Array.isArray(tasks.receipts) ? tasks.receipts : [];
    if (receipts.length) {
      var lr = el("details", "group");
      lr.appendChild(el("summary", "", "Last results (" + receipts.length + ")"));
      var lin = el("div");
      receipts.forEach(function (r) {
        lin.appendChild(el("p", "hint", ago(nowSec() - r.at) + " ago"));
        var ul = el("ul");
        r.lines.slice(0, 60).forEach(function (l) { ul.appendChild(el("li", /^kept|refused/.test(l) ? "err" : "", l)); });
        lin.appendChild(ul);
      });
      lr.appendChild(lin);
      box.appendChild(lr);
    }
  }
  renderTasks(data.tasks);

  var src = el("div", "sources");
  src.appendChild(el("b", "", "Sources: " + (data.sources ? data.sources.ok + " of " + data.sources.total + " read" : "unknown")));
  var sl = el("ul");
  srcItems.forEach(function (s) { sl.appendChild(el("li", s.read === "ok" ? "" : "bad", s.label + ": " + s.read + (s.detail ? " - " + s.detail : ""))); });
  (data.notes || []).forEach(function (n) { sl.appendChild(el("li", "", n)); });
  src.appendChild(sl);
  root.appendChild(src);

  function syncAll() { syncers.forEach(function (f) { f(); }); }
  syncAll();
  /* Lavish restores form fields by message after a live reload; repaint then. */
  window.addEventListener("message", function () { setTimeout(syncAll, 0); setTimeout(syncAll, 300); });
  tickFresh();
  setInterval(tickFresh, 15000);
})();
</script>
</body>
</html>
