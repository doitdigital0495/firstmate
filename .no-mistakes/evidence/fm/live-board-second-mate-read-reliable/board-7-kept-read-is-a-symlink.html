<style>
/* Shipped renderer for bin/fm-live-board.sh. Self-contained: no external
   fonts, scripts, images or requests. Palette follows the Firstmate
   navy/gold/rust/sea tokens, adapted to an explicitly dark surface. */
:root {
  color-scheme: dark;
  --bg: #11172a; --bg-raised: #1a2238; --bg-card: #1f2843; --bg-inset: #161d33;
  --line: #2f3b5e; --line-soft: #263152;
  --text: #e9e3d3; --text-strong: #fbf4e2; --text-muted: #a7afc6; --text-faint: #7f89a6;
  --gold: #e0a52e; --gold-soft: #3a3020; --rust: #e08365; --rust-soft: #3b2421;
  --sea: #7cc4a0; --sea-soft: #1f3a30; --ocean: #8cc0dd; --ocean-soft: #1d3346;
  --focus: 0 0 0 3px #f0d38c;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { background: var(--bg); color: var(--text); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
a { color: var(--ocean); overflow-wrap: anywhere; }
a:focus-visible, button:focus-visible, summary:focus-visible, .idle li:focus-visible, input:focus-visible, textarea:focus-visible, .q-opt:focus-within { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.lb { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }
.lb-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.lb-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lb-title h1 { margin: 0; font-size: 1.35rem; color: var(--text-strong); letter-spacing: 0.01em; }
.lb-home { color: var(--text-muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.lb-fresh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-muted); font-size: 0.85rem; }
.lb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 16px 0; }
.lb-stat { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.lb-stat b { display: block; font-size: 1.3rem; color: var(--text-strong); }
.lb-stat span { color: var(--text-muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
.lb-stat.is-hot { border-color: #6b5326; background: var(--gold-soft); }

.b-live { background: var(--sea-soft); color: var(--sea); border-color: #2f6b4f; }

.b-muted { background: var(--bg-inset); color: var(--text-muted); border-color: var(--line); }

.toc-box li { min-width: 0; }

.lb-empty h2 { color: var(--text-strong); margin: 8px 0 4px; font-size: 1.1rem; }
.proj { background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 14px; margin: 0 0 14px; min-width: 0; }
.proj.has-q { border-color: #6b5326; }

.pb-done { background: var(--sea); } .pb-doing { background: var(--ocean); } .pb-next { background: var(--text-faint); } .pb-charted { background: var(--gold); }

.proj-body { padding: 10px 12px 12px; display: grid; gap: 10px; min-width: 0; }
.sec-label { margin: 2px 4px 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); }
.q { background: var(--bg-card); border: 1px solid #6b5326; border-left: 4px solid var(--gold); border-radius: 10px; padding: 12px 14px; min-width: 0; }

.q-answered { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; min-width: 0; }

.q-answered-main b { color: var(--sea); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
.q-answered-main span { color: var(--text-strong); }
.q-answered-acts { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.q-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.q h3 { margin: 0; font-size: 1.02rem; line-height: 1.4; color: var(--text-strong); overflow-wrap: anywhere; white-space: pre-wrap; }
.q-project { margin: 8px 0 0; color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.q-project b { color: var(--text-strong); font-weight: 600; }
.q-topic::before { content: "\00b7"; margin: 0 6px; }

.q-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 4px 12px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-inset); cursor: pointer; min-width: 0; }

.tray-text { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }

.lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; min-width: 0; }

.lane-say { margin: 0; color: var(--text-muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.lane-doing { grid-column: 1 / -1; border-top: 3px solid var(--sea); } .lane-next { border-top: 3px solid var(--ocean); } .lane-charted { border-top: 3px solid var(--gold); }
.lane-none { margin: 0; color: var(--text-faint); font-size: 0.85rem; }
.lane-more { min-width: 0; }
.lane-more summary { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; min-height: 28px; }

.w { display: grid; gap: 4px; padding: 9px 11px; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--bg-card); min-width: 0; }

.w-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.w-title { color: var(--text-strong); overflow-wrap: anywhere; }
.w-note { color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.w-when { color: var(--text-faint); font-size: 0.78rem; }
.what { min-width: 0; font-size: 0.85rem; color: var(--text-muted); }

.asked { margin: 0 0 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-raised); min-width: 0; }

<script>

    warn: '<svg class="dot" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#e0a52e"/></svg>',

    stale: "This question changed after its answer options were written. Firstmate must refresh it before you can answer here.",
    duplicate: "This question carries conflicting answer options. Firstmate must review it before you can answer here.",
    invalid: "This question's answer options are malformed. Firstmate must review it before you can answer here.",
    ambiguous: "Firstmate cannot tell exactly which piece of work this question belongs to. It must review it before you can answer here."
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;

  }
  function badge(cls, text, dot) {
    var b = el("span", "badge " + cls);
    if (dot) { var d = el("span"); d.innerHTML = DOT[dot]; b.appendChild(d); }

    return b;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

    if (seconds < 5400) return Math.round(seconds / 60) + " min ago";

    return Math.round(seconds / 86400) + " days ago";

  function dateEpoch(text) {

  /* A queued answer shrinks its card to one line. That lives in a hidden field

  function cardPart(name, label, node) {

  }

  function questionCard(q, project) {
    var urgent = q.urgent === true;
    var base = "q" + (urgent ? " q-urgent" : "");
    var card = el("article", base);
    card.setAttribute("data-question", q.id);
    card.setAttribute("data-mode", q.mode);
    var top = el("div", "q-top");
    top.appendChild(badge(urgent ? "b-danger" : "b-warn", urgent ? "urgent question" : "question for you"));
    if (q.deferred_until) top.appendChild(badge("b-muted", "you deferred this until " + q.deferred_until));
    if (q.waiting_on_other_work) top.appendChild(badge("b-muted", "waits on other work first"));
    card.appendChild(top);
    var where = el("p", "q-project");
    where.setAttribute("data-part", "project");
    where.appendChild(el("b", "", project));
    if (q.topic) where.appendChild(el("span", "q-topic", q.topic));
    card.appendChild(where);
    if (q.about) card.appendChild(cardPart("about", "What this is about", el("p", "q-say", q.about)));
    if (q.purpose) card.appendChild(cardPart("purpose", "What it is for", el("p", "q-say", q.purpose)));
    // A card a manager cannot place says so itself; it never just looks short.
    var bare = q.needs_explanation !== false || !q.about || !q.purpose;
    if (bare) {
      var missing = el("div", "q-missing");
      missing.setAttribute("data-part", "needs-explanation");
      missing.setAttribute("role", "note");
      missing.appendChild(el("b", "", "Needs a plain-language explanation"));
      missing.appendChild(el("span", "", "Firstmate has not yet written in plain words " +
        (q.about ? "what answering this is for" : q.purpose ? "what this is about" : "what this is about and what answering it is for") +
        ". Ask Firstmate to explain it before you answer."));
      card.appendChild(missing);
    }
    card.appendChild(cardPart("question", "The question", el("h3", "", q.text)));
    if (bare && q.why && q.why !== q.text) {
      var why = el("p", "q-why");
      why.appendChild(el("b", "", "Why it is asked: "));
      why.appendChild(el("span", "", q.why));
      card.appendChild(why);
    }
    var meta = el("div", "meta");
    var since = dateEpoch(q.asked);
    meta.appendChild(el("span", "", since === null ? "asked at an unknown time" : "asked " + ago(Date.now() / 1000 - since)));
    card.appendChild(meta);

    var options = Array.isArray(q.options) ? q.options : [];
    if (q.mode === "options" || q.mode === "text") {
      if (!q.lifecycle || (q.close !== "done" && q.close !== "release")) q.mode = "read-only";
    }
    if (q.mode !== "options" && q.mode !== "text" && q.mode !== "free-text") {

      card.appendChild(ro);
      return card;
    }
    var guarded = q.mode !== "free-text";
    if (!guarded) options = [];

    var form = el("form", "q-form");
    form.setAttribute("data-lavish-question", "live-board:" + q.id + (guarded ? "#" + q.lifecycle : ""));
    var opts = el("div", "q-opts");
    if (!options.length) opts.hidden = true;
    else {
      opts.setAttribute("data-part", "options");
      form.appendChild(el("div", "q-label", "Your options"));
    }
    var radios = [];
    options.forEach(function (o) {
      var rec = q.recommendation && q.recommendation === o.value;
      var lab = el("label", "q-opt" + (rec ? " is-rec" : ""));

      var input = document.createElement("input");
      input.type = "radio"; input.name = "answer"; input.value = o.value;
      radios.push(input);
      lab.appendChild(input);
      var body = el("span", "q-opt-body");
      body.appendChild(el("span", "q-opt-label", o.label));
      if (o.detail) {
        var result = el("span", "q-opt-result");
        result.appendChild(el("span", "q-opt-lead", "If you pick this: "));
        result.appendChild(el("span", "q-opt-detail", o.detail));
        body.appendChild(result);
      }
      lab.appendChild(body);
      if (rec) { var r = badge("b-live", "Firstmate recommends this"); r.className += " rec"; lab.appendChild(r); }
      opts.appendChild(lab);
    });
    form.appendChild(opts);
    var note;
    if (options.length) {
      note = document.createElement("input");
      note.type = "text";
      note.placeholder = "optional note for Firstmate";
      note.setAttribute("aria-label", "Optional note");
    } else {
      note = document.createElement("textarea");
      note.placeholder = "Type your answer";

    var btn = el("button", "btn", "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);
    foot.appendChild(el("span", "q-mode", !guarded

    status.setAttribute("role", "status");
    foot.appendChild(status);
    form.appendChild(foot);

    var kept = document.createElement("input");
    kept.type = "hidden"; kept.name = "queued"; kept.value = "";
    form.appendChild(kept);
    var answered = el("div", "q-answered");
    answered.hidden = true;
    var said = el("div", "q-answered-main");
    var saidText = el("span");
    said.appendChild(el("b", "", "Answer queued in Lavish")); said.appendChild(saidText);
    answered.appendChild(said);
    var acts = el("div", "q-answered-acts");
    var change = el("button", "btn btn-quiet", "Change answer");

    acts.appendChild(change);
    answered.appendChild(acts);
    form.appendChild(answered);

      var shown = keptAnswer();
      card.className = base + (shown ? " is-queued" : "");

      saidText.textContent = q.text + " - " + shown;
    });

      status.className = "q-status";

    });

    form.addEventListener("submit", function (ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      status.className = "q-status";
      var value = "";
      radios.forEach(function (r) { if (r.checked) value = r.value; });
      var noteText = (note.value || "").replace(/\s+/g, " ").trim();
      if (!value && !noteText) {
        status.className = "q-status err";
        status.textContent = options.length ? "Pick one of the options or write a note first." : "Write your answer first.";
        return;
      }
      var label = value;
      options.forEach(function (o) { if (o.value === value) label = o.label; });
      var shown = value ? (noteText ? label + " - " + noteText : label) : noteText;
      if (utf8Bytes(value) + utf8Bytes(noteText) + 3 > 512 || utf8Bytes(shown) > 512) {
        status.className = "q-status err";
        status.textContent = "The answer is too long to send (512 bytes maximum).";
        return;
      }
      if (!(window.lavish && window.lavish.queuePrompt)) {
        status.className = "q-status err";
        status.textContent = "Answers can only be sent when this board is open in Lavish.";
        return;
      }
      var data = { schema: "fm-bearings-answer.v1", question: q.id, selection: value, note: noteText };
      if (guarded) { data.close = q.close; data.lifecycle = q.lifecycle; }
      window.lavish.queuePrompt(
        "Live board answer - " + q.text + ": " + shown,
        { tag: "choice", text: q.text + " -> " + shown, element: form, data: data });

      setKept(shown);
    });

  }

  /* The projection writes every explanation and names its source; the page

  var NO_EXPLANATION = "No explanation recorded yet";

    note: "From this item's own note in the task list.",
    call: "From the question Firstmate asked you about this item.",

  function whatIsThis(text, source) {

    var box = el("details", "what");
    box.setAttribute("data-explain", known ? (EXPLAIN_SOURCE[source] ? source : "note") : "missing");
    var say = el("summary");
    say.appendChild(el("b", "", "What this is: "));
    say.appendChild(el("span", "", known ? text : NO_EXPLANATION));
    box.appendChild(say);
    box.appendChild(el("p", "what-src", EXPLAIN_SOURCE[known ? source : "missing"] || EXPLAIN_SOURCE.note));
    return box;
  }

  function when(epoch) {
    if (typeof epoch !== "number") return "";
    var d = new Date(epoch * 1000);
    if (isNaN(d.getTime())) return "";
    var m = d.getMinutes();
    return d.getDate() + " " + MONTHS[d.getMonth()] + ", " + d.getHours() + ":" + (m < 10 ? "0" : "") + m;
  }
  /* What the captain typed on this board and Firstmate's answer to each;

    var names = foldNames(foldKept.value);
    folds.forEach(function (f) {
      var want = names.indexOf(f.name) !== -1;
      if (want !== f.collapsed()) f.fold(want);
    });
  }
  try { foldKept.value = JSON.stringify(foldNames(window.localStorage.getItem(FOLD_STORE))); } catch (e) { foldKept.value = "[]"; }

  /* A contents entry jumps to its card or quiet line, opening whatever hides
     it. Lavish takes a press on a plain link as a request to annotate it, so
     each entry is marked as an action of the page's own. */
  var tocList = el("ol");
  function tocEntry(p, id, reveal, focusOn) {
    var li = el("li");
    var a = el("a", "toc-link");
    a.href = "#" + id;
    a.setAttribute("data-toc", p.name);
    a.setAttribute("data-lavish-action", "");
    a.appendChild(el("span", "", p.name));
    if ((p.counts || {}).questions) a.appendChild(el("span", "toc-count", plural(p.counts.questions, "question")));
    if (!p.active) a.appendChild(el("span", "toc-quiet", "quiet"));
    a.addEventListener("click", function (ev) {
      var target = reveal();
      /* Without scripted scrolling the link's own jump still lands on it. */
      if (typeof target.scrollIntoView !== "function") return;
      ev.preventDefault();
      target.scrollIntoView({ block: "start" });
      try { focusOn.focus({ preventScroll: true }); } catch (e) { /* the jump itself already happened */ }
    });
    li.appendChild(a);
    tocList.appendChild(li);
  }

  function projectSection(p, id) {
    var c = p.counts || {};
    var cls = "proj" + (c.questions ? " has-q" : "");
    var sec = el("section", cls);
    sec.setAttribute("id", id);
    sec.setAttribute("data-project", p.name);
    sec.setAttribute("data-project-key", p.key);
    var head = el("div", "proj-head");
    var title = el("div", "proj-title");
    var name = el("div", "proj-name");
    var h2 = el("h2", "", p.name);
    h2.setAttribute("id", id + "-name");
    name.appendChild(h2);
    if (c.urgent) name.appendChild(badge("b-danger", plural(c.urgent, "urgent question")));
    if (c.questions - (c.urgent || 0) > 0) name.appendChild(badge("b-warn", plural(c.questions - (c.urgent || 0), "question")));
    if (c.stuck) name.appendChild(badge("b-danger", c.stuck + " stuck"));
    title.appendChild(name);
    var toggle = el("button", "btn btn-quiet proj-toggle");
    toggle.type = "button";
    toggle.setAttribute("id", id + "-toggle");
    toggle.setAttribute("data-project-toggle", "");
    toggle.setAttribute("aria-controls", id + "-body");
    toggle.setAttribute("aria-labelledby", id + "-toggle " + id + "-name");
    var chev = el("span", "proj-chev");
    chev.innerHTML = CHEVRON;
    toggle.appendChild(chev);
    var toggleSay = el("span");
    toggle.appendChild(toggleSay);
    title.appendChild(toggle);
    head.appendChild(title);
    if (p.description && p.description === p.explain) head.appendChild(el("p", "proj-desc", p.description));
    else {
      if (p.description) head.appendChild(el("p", "proj-desc", p.description));
      head.appendChild(whatIsThis(p.explain, p.explain === NO_EXPLANATION ? "missing" : "project"));
    }
    head.appendChild(el("p", "proj-status", p.status));
    head.appendChild(progress(c));
    if (p.latest) {
      var latest = el("p", "proj-latest");
      latest.setAttribute("data-latest", "");
      latest.appendChild(el("b", "", "Latest: "));
      latest.appendChild(el("span", "", p.latest.title + " - " + p.latest.note +
        (typeof p.latest.at === "number" ? " (" + ago(Date.now() / 1000 - p.latest.at) + ")" : "")));
      head.appendChild(latest);
    }
    sec.appendChild(head);
    var body = el("div", "proj-body");
    body.setAttribute("id", id + "-body");
    /* A collapsed card keeps its name, badges and status line. */
    var collapsed = false;
    function fold(to) {
      collapsed = to;
      sec.className = cls + (collapsed ? " is-collapsed" : "");
      body.hidden = collapsed;
      toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      toggleSay.textContent = collapsed ? "Expand" : "Collapse";
    }
    fold(foldNames(foldKept.value).indexOf(p.name) !== -1);
    folds.push({ name: p.name, fold: fold, collapsed: function () { return collapsed; } });
    toggle.addEventListener("click", function () { fold(!collapsed); keepFolds(); });
    tocEntry(p, id, function () {
      if (collapsed) { fold(false); keepFolds(); }
      return sec;
    }, toggle);
    if ((p.questions || []).length) {
      body.appendChild(el("div", "sec-label", "Questions for you"));
      p.questions.forEach(function (q) { body.appendChild(questionCard(q, p.name)); });
    }
    var lanes = el("div", "lanes");
    LANES.forEach(function (lane) { lanes.appendChild(laneSection(lane, (p.lanes || {})[lane[0]] || [])); });
    body.appendChild(lanes);
    var stages = stageSection(p);
    if (stages) body.appendChild(stages);
    body.appendChild(timelineSection(p));
    sec.appendChild(body);
    return sec;
  }

  var host = document.getElementById("lb-projects");
  paintAsked(payload.asked);
  var active = view.projects.filter(function (p) { return p.active; });
  var quiet = view.projects.filter(function (p) { return !p.active; });
  if (!active.length) {
    var empty = el("div", "lb-empty");
    empty.setAttribute("data-empty", "true");
    empty.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#1f3a30"/><path d="M12 20 L18 26 L29 14" fill="none" stroke="#7cc4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    empty.appendChild(el("h2", "", "Nothing running and no questions for you"));
    empty.appendChild(el("p", "", (board.coverage && board.coverage.local && board.coverage.local.trustworthy)
      ? "No project has open work right now."
      : "No open work was found, but the board could not see everything - see the board notes below."));
    host.appendChild(empty);
  }
  active.forEach(function (p, i) { host.appendChild(projectSection(p, "lb-card-" + (i + 1))); });
  if (quiet.length) {
    var box = el("details", "idle");
    box.setAttribute("data-idle", String(quiet.length));
    box.appendChild(el("summary", "", plural(quiet.length, "quiet project") + " with no open work"));
    var ul = el("ul");
    quiet.forEach(function (p, i) {
      var li = el("li");
      li.setAttribute("id", "lb-quiet-" + (i + 1));
      li.setAttribute("tabindex", "-1");
      li.setAttribute("data-quiet-project", p.name);
      tocEntry(p, "lb-quiet-" + (i + 1), function () { box.open = true; return li; }, li);
      li.appendChild(el("b", "", p.name));
      li.appendChild(whatIsThis(p.explain, p.explain === NO_EXPLANATION || !p.explain ? "missing" : "project"));
      var extra = [];
      if (p.counts && p.counts.finished) extra.push(p.counts.finished + " done in the last 2 weeks");
      if (extra.length) li.appendChild(el("span", "", " - " + extra.join(" · ")));
      var stages = stageSection(p);
      if (stages) li.appendChild(stages);
      if (p.timeline && ((p.timeline.items || []).length || (p.timeline.unread || []).length)) li.appendChild(timelineSection(p));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    host.appendChild(box);
  }
  var toc = document.getElementById("lb-toc");
  toc.hidden = !tocList.firstChild;
  if (tocList.firstChild) {
    toc.setAttribute("data-lavish-question", "live-board-collapsed");
    var tocBox = el("details", "toc-box");
    /* A phone gets the contents folded to one line, so the cards stay near the top. */
    tocBox.open = true;
    try { tocBox.open = window.matchMedia("(min-width: 641px)").matches; } catch (e) { /* it stays open */ }
    var tocSay = el("summary");
    tocSay.appendChild(el("b", "", "Contents"));
    tocSay.appendChild(el("span", "", " · " + plural(active.length + quiet.length, "project")));
    tocBox.appendChild(tocSay);
    tocBox.appendChild(tocList);
    toc.appendChild(tocBox);
    toc.appendChild(foldKept);
  }

  function syncRestored() {
    syncAnswers();
    pinSyncs.forEach(function (sync) { sync(); });
    syncFolds();
  }
  syncAnswers();
  paintTray();
  /* Lavish restores form fields by message after a reload, so repaint then. */
  if (typeof window.addEventListener === "function") {
    window.addEventListener("message", function () {
      setTimeout(syncRestored, 0);
      setTimeout(syncRestored, 300);
    });
  }

  if ((view.notes || []).length) {
    var notes = el("details", "lb-notes");
    notes.appendChild(el("summary", "", plural(view.notes.length, "board note")));
    var nl = el("ul");
    view.notes.forEach(function (t) { nl.appendChild(el("li", "", t)); });
    notes.appendChild(nl);
    document.getElementById("lb-notes").appendChild(notes);
  }

  document.getElementById("lb-foot").textContent =
    "Collected " + board.collected_at + " in " + board.collection_duration_seconds + "s · revision " +
    String(board.revision || "").slice(0, 12) + " · answers go through Firstmate's captain-hold intake.";
})();
</script>
</body>
</html>
